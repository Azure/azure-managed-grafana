name: "Copilot Setup Steps"

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    env:
      AzureUnitTestSubscriptionId: 'd320f99c-3d38-41c8-89d6-021f326613b8'
    
    permissions:
      id-token: write
      contents: read
    environment: Copilot
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      
      - name: Setup amg-mcp
        run: |
          mkdir -p bin
          curl -L -o bin/amg-mcp https://github.com/Azure/azure-managed-grafana/releases/download/v0.0.2/amg-mcp-linux-x64
          chmod +x bin/amg-mcp
          echo "Downloaded amg-mcp to $(pwd)/bin/amg-mcp"

      - name: Azure login
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: f8216088-b377-492f-a834-9724b6110732
          tenant-id: 72f988bf-86f1-41af-91ab-2d7cd011db47
          subscription-id: d320f99c-3d38-41c8-89d6-021f326613b8
